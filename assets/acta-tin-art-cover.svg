<svg xmlns="http://www.w3.org/2000/svg" width="690" height="786" viewBox="0 0 690 786" role="img" aria-labelledby="title desc">
  <title id="title">Acta Materialia single-crystal beta-tin paper cover</title>
  <desc id="desc">Accurate visual summary of the target crystal orientation, T-shaped micro-tension specimen, straight micro-cantilever with tungsten loading layer, and in-situ loading methods used in the paper</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#e9e5de"/>
    </linearGradient>
    <linearGradient id="ipf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e84c50"/>
      <stop offset="0.38" stop-color="#f0c750"/>
      <stop offset="0.69" stop-color="#4cb88d"/>
      <stop offset="1" stop-color="#3d72c7"/>
    </linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6d8"/>
      <stop offset="0.48" stop-color="#f1f3f1"/>
      <stop offset="1" stop-color="#98a5ab"/>
    </linearGradient>
    <linearGradient id="stress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d44d54" stop-opacity=".95"/>
      <stop offset="0.32" stop-color="#ed9a5f" stop-opacity=".72"/>
      <stop offset="1" stop-color="#267ca4" stop-opacity=".1"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17202b" flood-opacity=".22"/>
    </filter>
    <clipPath id="orientationDisc"><circle cx="0" cy="0" r="66"/></clipPath>
  </defs>

  <rect width="690" height="786" fill="url(#paper)"/>
  <rect width="12" height="786" fill="#9f3449"/>
  <path d="M12 0H690V205L12 303Z" fill="#172334"/>
  <path d="M12 303 690 205v28L12 331Z" fill="#df8656"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="54" fill="#fff" font-size="18" font-weight="700" letter-spacing="3.2">ACTA MATERIALIA</text>
    <text x="42" y="83" fill="#d6e0e6" font-size="12.5" letter-spacing=".6">FULL LENGTH ARTICLE  ·  VOLUME 316  ·  122458</text>
    <text x="42" y="140" fill="#fff" font-size="47" font-weight="800">β-Sn</text>
    <text x="151" y="139" fill="#f3d19a" font-size="15" font-weight="700" letter-spacing="1.8">MICROSCALE PLASTICITY</text>
    <text x="42" y="181" fill="#d9e5eb" font-size="14">In-situ SEM tension and non-uniform bending</text>
  </g>

  <g transform="translate(541 104)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="73" fill="#f5f6f4" stroke="#d8e0e5" stroke-width="2"/>
    <g clip-path="url(#orientationDisc)" fill="none" stroke="#81909a" stroke-opacity=".68">
      <circle cx="0" cy="0" r="66" stroke-width="1.4"/>
      <ellipse cx="0" cy="0" rx="66" ry="22"/>
      <ellipse cx="0" cy="0" rx="66" ry="42"/>
      <ellipse cx="0" cy="0" rx="22" ry="66"/>
      <ellipse cx="0" cy="0" rx="42" ry="66"/>
      <path d="M-66 0H66M0-66V66M-48-48 48 48M48-48-48 48"/>
      <path d="M-66-8C-23-37 27-33 66-5M-66 9C-20 38 29 34 66 6" stroke-dasharray="4 4"/>
    </g>
    <path d="M0-13 12 8-12 8Z" fill="url(#ipf)" stroke="#fff" stroke-width="1"/>
    <circle cx="-31" cy="6" r="5.5" fill="#d44d54" stroke="#fff" stroke-width="2"/>
    <path d="M-31 6-64 24" stroke="#d44d54" stroke-width="2.5"/>
    <text x="-85" y="39" fill="#f3d19a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">[331]</text>
    <text x="0" y="93" text-anchor="middle" fill="#d9e5eb" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">TARGET ORIENTATION</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" transform="translate(0 0)">
    <rect x="42" y="333" width="285" height="228" rx="12" fill="#f7f5f0" stroke="#cbc7c0"/>
    <rect x="347" y="333" width="301" height="228" rx="12" fill="#f7f5f0" stroke="#cbc7c0"/>

    <text x="62" y="360" fill="#263747" font-size="12.5" font-weight="800" letter-spacing="1">MICRO-TENSION</text>
    <text x="367" y="360" fill="#263747" font-size="12.5" font-weight="800" letter-spacing="1">MICRO-CANTILEVER BENDING</text>

    <g transform="translate(181 441)" filter="url(#shadow)">
      <path d="M-49-75H49V-18C49-8 42-2 30 0H20V60C20 70 28 76 39 78H55V102H-55V78H-39C-28 76-20 70-20 60V0H-30C-42-2-49-8-49-18Z" fill="url(#sn)" stroke="#53636d" stroke-width="2"/>
      <rect x="-49" y="-75" width="98" height="56" rx="4" fill="#aeb8bc" fill-opacity=".72"/>
      <text x="0" y="-44" text-anchor="middle" fill="#334653" font-size="10.5" font-weight="700">GRIP PART</text>
      <text x="0" y="31" text-anchor="middle" fill="#5b2638" font-size="10" font-weight="700" transform="rotate(-90)">4 μm GAUGE</text>
      <path d="M0-104V-80" stroke="#9f3449" stroke-width="4"/>
      <path d="M0-104-8-91M0-104 8-91" fill="none" stroke="#9f3449" stroke-width="3"/>
      <path d="M-69 102H69" stroke="#314654" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="124" text-anchor="middle" fill="#58656d" font-size="10.5">T-shaped specimen · 2 × 2 μm²</text>
    </g>

    <g transform="translate(495 443)" filter="url(#shadow)">
      <rect x="87" y="-52" width="30" height="130" fill="#69747b"/>
      <path d="M-91-12H88V33H-91Z" fill="url(#sn)" stroke="#53636d" stroke-width="2"/>
      <rect x="-104" y="-12" width="14" height="45" fill="#393f45"/>
      <text x="-97" y="47" text-anchor="middle" fill="#9f3449" font-size="10" font-weight="800">W</text>
      <path d="M-116-72-78-72-97-31Z" fill="#49545c" stroke="#263747" stroke-width="2"/>
      <path d="M-97-78V-38" stroke="#9f3449" stroke-width="4"/>
      <path d="M-97-38-105-51M-97-38-89-51" fill="none" stroke="#9f3449" stroke-width="3"/>
      <rect x="53" y="-12" width="35" height="45" fill="url(#stress)" opacity=".9"/>
      <g stroke="#9f3449" stroke-width="1.7" stroke-opacity=".8">
        <path d="M58-4 81 16M58 7 81 27M66-10 87 9"/>
      </g>
      <text x="70" y="-25" text-anchor="middle" fill="#9f3449" font-size="9.5" font-weight="800">GNDs</text>
      <path d="M-90 64H88M-90 59V69M88 59V69" stroke="#59666f"/>
      <text x="-1" y="78" text-anchor="middle" fill="#58656d" font-size="10.5">L ≈ 6.7 μm · 2 × 2 μm² · W ≈ 500 nm</text>
    </g>

    <rect x="62" y="532" width="245" height="2" fill="#9f3449" opacity=".25"/>
    <rect x="367" y="532" width="261" height="2" fill="#267ca4" opacity=".25"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="42" y="576" width="606" height="43" rx="7" fill="#172334"/>
    <text x="62" y="594" fill="#f3d19a" font-size="10.5" font-weight="800" letter-spacing=".8">EXPERIMENTAL CONDITIONS</text>
    <text x="62" y="610" fill="#eef2f4" font-size="11.5">400 · 40 · 4 · 0.4 nm/s</text>
    <text x="215" y="610" fill="#b8c9d3" font-size="11.5">Hysitron PI-85 · in-situ SEM</text>
    <text x="424" y="610" fill="#f0ad86" font-size="11.5">active slip  (101)[-101]</text>

    <text x="42" y="659" fill="#172334" font-size="28.5" font-weight="800">The plasticity of single-crystal tin</text>
    <text x="42" y="692" fill="#273849" font-size="20" font-weight="650">Insights from strain rate and deformation gradient</text>

    <text x="42" y="730" fill="#414a52" font-size="12.4" font-weight="650">
      <tspan>Yabin Yan · Shijia Wan · Shotaro Ikemoto · Shota Ito · Kota Sugisaka ·</tspan>
      <tspan x="42" dy="20">Ziqin Zhang · Takashi Sumigawa · Fu-Zhen Xuan · Takayuki Kitamura</tspan>
    </text>
    <rect x="42" y="768" width="7" height="7" fill="#9f3449"/>
    <text x="60" y="776" fill="#59626a" font-size="11.5">https://doi.org/10.1016/j.actamat.2026.122458</text>
  </g>
</svg>
